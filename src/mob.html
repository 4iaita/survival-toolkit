  <section id="view-mobs" aria-label="Mobs" hidden>
    <p class="view-intro" id="mob-intro"></p>

    <section class="panel villager-panel mob-panel" aria-label="Mob">
      <div class="villager-scene">
        <div class="stage" id="mob-stage" data-biome="plains">
          <canvas class="stage-backdrop" id="mob-backdrop" aria-hidden="true"></canvas>
          <canvas class="stage-scene" id="mob-art" tabindex="0" role="img"></canvas>
          <span class="nametag" id="mob-tag" hidden></span>
          <span class="stage-hint" aria-hidden="true">
            <svg viewBox="0 0 11 5" width="22" height="10" shape-rendering="crispEdges"><path fill="currentColor" d="M2 0h1v1H2zM1 1h1v1H1zM0 2h11v1H0zM1 3h1v1H1zM2 4h1v1H2zM8 0h1v1H8zM9 1h1v1H9zM9 3h1v1H9zM8 4h1v1H8z"/></svg>
            Drag to turn
          </span>
        </div>
        <div class="try-bar" id="age-bar" hidden>
          <span class="cat-label" id="age-label">Age</span>
          <div class="try-tags" id="age-try" role="group" aria-labelledby="age-label"></div>
        </div>
        <div class="try-bar" id="variant-bar" hidden>
          <span class="cat-label" id="variant-label">Variant</span>
          <div class="try-tags" id="variant-try" role="group" aria-labelledby="variant-label"></div>
        </div>
        <div id="kind-rows"></div>
        <div class="try-bar" id="marks-bar" hidden>
          <span class="cat-label" id="marks-label">Markings</span>
          <div class="try-tags" id="marks-try" role="group" aria-labelledby="marks-label"></div>
        </div>
        <div class="try-bar" id="tint-bar" hidden>
          <span class="cat-label">Colors</span>
          <div id="tint-rows"></div>
        </div>
        <div class="try-bar" id="saddle-bar" hidden>
          <span class="cat-label" id="saddle-label">Saddle</span>
          <div class="try-tags" id="saddle-try" role="group" aria-labelledby="saddle-label"></div>
        </div>
        <div class="try-bar" id="chest-bar" hidden>
          <span class="cat-label" id="chest-label">Chest</span>
          <div class="try-tags" id="chest-try" role="group" aria-labelledby="chest-label"></div>
        </div>
        <div class="try-bar" id="carpet-bar" hidden>
          <span class="cat-label" id="carpet-label">Carpet</span>
          <div class="try-tags" id="carpet-try" role="group" aria-labelledby="carpet-label"></div>
        </div>
        <div class="try-bar" id="wool-bar" hidden>
          <span class="cat-label" id="wool-label">Wool</span>
          <div class="try-tags" id="wool-try" role="group" aria-labelledby="wool-label"></div>
        </div>
        <div class="try-bar" id="shear-bar" hidden>
          <span class="cat-label" id="shear-label">Shearing</span>
          <div class="try-tags" id="shear-try" role="group" aria-labelledby="shear-label"></div>
        </div>
        <div class="try-bar" id="size-bar" hidden>
          <span class="cat-label" id="size-label">Size</span>
          <div class="try-tags" id="size-try" role="group" aria-labelledby="size-label"></div>
        </div>
        <div class="try-bar" id="mood-bar" hidden>
          <span class="cat-label" id="mood-label">Mood</span>
          <div class="try-tags" id="mood-try" role="group" aria-labelledby="mood-label"></div>
          <div class="collar-row" id="collar-row" hidden>
            <span class="cat-label" id="collar-label"></span>
            <div class="try-tags" id="collar-try" role="group" aria-labelledby="collar-label"></div>
          </div>
        </div>
        <div class="try-bar" id="armor-bar" hidden>
          <span class="cat-label" id="armor-label">Armor</span>
          <div class="try-tags" id="armor-try" role="group" aria-labelledby="armor-label"></div>
          <div class="collar-row" id="armor-dye-row" hidden>
            <span class="cat-label" id="armor-dye-label"></span>
            <div class="try-tags" id="armor-dye-try" role="group" aria-labelledby="armor-dye-label"></div>
          </div>
          <div class="collar-row" id="armor-wear-row" hidden>
            <span class="cat-label" id="armor-wear-label">Condition</span>
            <div class="try-tags" id="armor-wear-try" role="group" aria-labelledby="armor-wear-label"></div>
          </div>
          <div class="collar-row" id="armor-glint-row" hidden>
            <span class="cat-label" id="armor-glint-label">Enchantment</span>
            <div class="try-tags" id="armor-glint-try" role="group" aria-labelledby="armor-glint-label"></div>
          </div>
        </div>
        <div class="try-bar">
          <span class="cat-label" id="tag-try-label">Name tag</span>
          <div class="try-tags" id="tag-try" role="group" aria-labelledby="tag-try-label"></div>
        </div>
      </div>

      <div class="villager-pick">
        <div class="panel-head">
          <h2 id="mob-name"></h2>
        </div>
        <div class="mob-order">
          <select class="mc-select" id="mob-order" aria-label="Order">
            <option value="az">Alphabetical</option>
            <option value="dim">Dimension</option>
            <option value="behavior">Behavior</option>
          </select>
        </div>
        <div class="cats" id="mob-picker" role="group" aria-label="Mob"></div>
      </div>
    </section>

    <div class="trade-grid">
      <article class="panel result mob-result" id="mob-result"></article>

      <div class="trade-side">
        <section class="panel">
          <h2><label for="mob-search">Find a mob</label></h2>
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 8 8" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 0h3v1H2zM1 1h1v1H1zM5 1h1v1H5zM0 2h1v3H0zM6 2h1v3H6zM1 5h1v1H1zM5 5h1v1H5zM2 6h3v1H2zM6 6h1v1H6zM7 7h1v1H7z"/></svg>
            <input type="search" class="mc-input" id="mob-search" placeholder="Cow, Enderman, Wolf…" autocomplete="off" spellcheck="false">
          </div>
          <div class="search-results" id="mob-results" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </section>
