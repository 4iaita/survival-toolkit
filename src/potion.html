  <section id="view-potions" aria-label="Potions" hidden>
    <p class="view-intro">Every potion you can brew. Pick one and how you want it to see what it does, how long each version lasts, where its ingredients come from, where it can be found, and a brewing plan for as many bottles as you need.</p>

    <section class="panel villager-panel mob-panel" aria-label="Potion">
      <div class="villager-scene">
        <div class="stage prop-stage" id="potion-stage" data-biome="plains">
          <canvas class="stage-scene" id="potion-art" tabindex="0" role="img"></canvas>
          <span class="stage-hint" aria-hidden="true">
            <svg viewBox="0 0 11 5" width="22" height="10" shape-rendering="crispEdges"><path fill="currentColor" d="M2 0h1v1H2zM1 1h1v1H1zM0 2h11v1H0zM1 3h1v1H1zM2 4h1v1H2zM8 0h1v1H8zM9 1h1v1H9zM9 3h1v1H9zM8 4h1v1H8z"/></svg>
            Drag to turn
          </span>
        </div>
        <div class="try-bar" id="potion-mod-bar">
          <span class="cat-label" id="potion-mod-label">Strength</span>
          <div class="try-tags" id="potion-mod" role="group" aria-labelledby="potion-mod-label"></div>
        </div>
        <div class="try-bar">
          <span class="cat-label" id="potion-form-label">Bottle</span>
          <div class="try-tags" id="potion-form" role="group" aria-labelledby="potion-form-label"></div>
        </div>
      </div>

      <div class="villager-pick">
        <div class="panel-head">
          <h2 id="potion-name"></h2>
        </div>
        <div class="cats" id="potion-picker" role="group" aria-label="Potion"></div>
      </div>
    </section>

    <div class="trade-grid">
      <article class="panel result mob-result" id="potion-result"></article>

      <div class="trade-side">
        <section class="panel">
          <h2><label for="potion-search">Find a potion</label></h2>
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 8 8" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 0h3v1H2zM1 1h1v1H1zM5 1h1v1H5zM0 2h1v3H0zM6 2h1v3H6zM1 5h1v1H1zM5 5h1v1H5zM2 6h3v1H2zM6 6h1v1H6zM7 7h1v1H7z"/></svg>
            <input type="search" class="mc-input" id="potion-search" placeholder="Swiftness, Jump Boost, Sugar…" autocomplete="off" spellcheck="false">
          </div>
          <div class="search-results" id="potion-results" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </section>
